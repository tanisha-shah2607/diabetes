<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disease Prediction System</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="text-center mb-4">
                            <i data-feather="activity" class="mb-3"></i>
                            Disease Prediction System
                        </h1>
                        
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form id="predictionForm" action="{{ url_for('predict') }}" method="POST">
                            <div class="mb-3">
                                <label for="age" class="form-label">Age</label>
                                <input type="number" class="form-control" id="age" name="age" required min="0" max="120">
                            </div>
                            
                            <div class="mb-3">
                                <label for="temperature" class="form-label">Body Temperature (°C)</label>
                                <input type="number" class="form-control" id="temperature" name="temperature" required step="0.1" min="35" max="42">
                            </div>
                            
                            <div class="mb-3">
                                <label for="heart_rate" class="form-label">Heart Rate (bpm)</label>
                                <input type="number" class="form-control" id="heart_rate" name="heart_rate" required min="40" max="200">
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col">
                                    <label for="blood_pressure_systolic" class="form-label">Blood Pressure (Systolic)</label>
                                    <input type="number" class="form-control" id="blood_pressure_systolic" name="blood_pressure_systolic" required min="70" max="200">
                                </div>
                                <div class="col">
                                    <label for="blood_pressure_diastolic" class="form-label">Blood Pressure (Diastolic)</label>
                                    <input type="number" class="form-control" id="blood_pressure_diastolic" name="blood_pressure_diastolic" required min="40" max="130">
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="respiratory_rate" class="form-label">Respiratory Rate (breaths/min)</label>
                                <input type="number" class="form-control" id="respiratory_rate" name="respiratory_rate" required min="8" max="40">
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" id="submitBtn">
                                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                    Predict Disease
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
